services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: actionlens
      POSTGRES_USER: actionlens
      POSTGRES_PASSWORD: actionlens
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actionlens -d actionlens"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://actionlens:actionlens@postgres:5432/actionlens
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://actionlens:actionlens@postgres:5432/actionlens
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ORIGIN: http://localhost:5174
      APP_URL: http://localhost:5174
      UPLOAD_DIR: /app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  document-worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://actionlens:actionlens@postgres:5432/actionlens
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      UPLOAD_DIR: /app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    command: ["node", "dist/workers/document.worker.js"]
    restart: unless-stopped

  reminder-worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://actionlens:actionlens@postgres:5432/actionlens
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      UPLOAD_DIR: /app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    command: ["node", "dist/workers/reminder.worker.js"]
    restart: unless-stopped

  email-worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://actionlens:actionlens@postgres:5432/actionlens
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      UPLOAD_DIR: /app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["node", "dist/workers/email.worker.js"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    depends_on:
      - api
    ports:
      - "5174:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads:
